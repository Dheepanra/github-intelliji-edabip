spring.application.name=edabip-users-api
server.port=8080

# H2 in-memory DB (zero setup). To use MySQL, swap these 3 lines + driver in pom.xml
spring.datasource.url=jdbc:h2:mem:edabip;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.h2.console.enabled=true
